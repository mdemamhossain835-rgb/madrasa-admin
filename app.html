    /* কাগজের উচ্চতা অপরিবর্তিত; বেশি লেখা হলে অক্ষর ছোট করে এক পাতায় ধরানো হয় */
    function fitContent() {
        const paper = document.getElementById('a4Paper');
        const note = document.getElementById('fitNote');
        const full = paper.classList.contains('full-page');
        const boxes = Array.from(paper.querySelectorAll(full ? '.fit-box' : '.exam-section'));
        if (!boxes.length) return;

        let fs = 13;
        paper.style.setProperty('--qfs', fs + 'px');

        const over = () => boxes.some(b => {
            const list = b.querySelector('.preview-question-list');
            if (!list) return false;
            const br = b.getBoundingClientRect();
            const sc = b.offsetHeight ? br.height / b.offsetHeight : 1;
            const pb = parseFloat(getComputedStyle(b).paddingBottom) || 0;
            return list.getBoundingClientRect().bottom > br.bottom - pb * sc + 1;
        });

        while (over() && fs > 8) {
            fs -= 0.5;
            paper.style.setProperty('--qfs', fs + 'px');
        }

        note.className = '';
        note.style.display = 'none';
        if (over()) {
            note.className = 'warn';
            note.textContent = '⚠️ প্রশ্ন বেশি হওয়ায় সবচেয়ে ছোট অক্ষরেও এক পাতায় ধরেনি, নিচের কিছু অংশ কাটা পড়বে। প্রশ্ন কমান বা ফুল পেজ বেছে নিন।';
            note.style.display = 'block';
        } else if (fs < 13) {
            note.className = 'info';
            note.textContent = 'ℹ️ সব প্রশ্ন এক পাতায় ধরাতে প্রশ্নের অক্ষর ' + bn(fs) + ' পিক্সেলে নামানো হয়েছে।';
            note.style.display = 'block';
        }
    }

    function fontsReady() {
        return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    }

    function dlStatus(msg, kind) {
        const n = document.getElementById('dlNote');
        n.className = kind || '';
        n.textContent = msg;
        n.style.display = msg ? 'block' : 'none';
    }

    function withTimeout(p, ms) {
        return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
    }

    function blobToBase64(blob) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result).split(',')[1]);
            r.onerror = () => rej(r.error);
            r.readAsDataURL(blob);
        });
    }

    /* ফাইল সংরক্ষণ: ১) অ্যাপের Filesystem+Share প্লাগইন ২) ফোনের শেয়ার ৩) সাধারণ ডাউনলোড */
    async function saveBlob(blob, name) {
        try {
            const C = (window.parent && window.parent.Capacitor) || window.Capacitor;
            if (C && C.isPluginAvailable && C.isPluginAvailable('Filesystem') && C.isPluginAvailable('Share')) {
                const FS = (C.Plugins && C.Plugins.Filesystem) || C.registerPlugin('Filesystem');
                const SH = (C.Plugins && C.Plugins.Share) || C.registerPlugin('Share');
                const data = await blobToBase64(blob);
                const w = await FS.writeFile({ path: name, data: data, directory: 'CACHE' });
                await SH.share({ title: name, url: w.uri, dialogTitle: 'প্রশ্নপত্র সংরক্ষণ করুন' });
                return 'share';
            }
        } catch (e) {
            if (/cancel|abort|dismiss/i.test(String((e && (e.message || e.name)) || e))) return 'cancel';
        }
        try {
            const file = new File([blob], name, { type: blob.type });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: name });
                return 'share';
            }
        } catch (e) {
            if (e && e.name === 'AbortError') return 'cancel';
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        return 'download';
    }

    function dlDone(method, label) {
        if (method === 'cancel') { dlStatus(''); return; }
        if (method === 'share') dlStatus('✅ ' + label + ' তৈরি হয়েছে। খোলা উইন্ডো থেকে সেভ করুন।', 'ok');
        else dlStatus('✅ ' + label + ' ডাউনলোড চালু করা হয়েছে। ফোনের Downloads ফোল্ডার দেখুন। ফাইল না এলে অ্যাপে ফাইল সেভের সুবিধা চালু করতে হবে।', 'ok');
    }

    async function downloadPDF() {
        if (typeof html2pdf === 'undefined') {
            dlStatus('⚠️ PDF লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।', 'err');
            return;
        }
        const element = document.getElementById('a4Paper');
        const originalTransform = element.style.transform;
        const layout = document.getElementById('layoutSelector').value;
        const orientation = layout === 'portrait' ? 'portrait' : 'landscape';

        const opt = {
            margin:       0,
            filename:     'Question_Paper.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: orientation }
        };

        dlStatus('⏳ PDF তৈরি হচ্ছে... একটু অপেক্ষা করুন', 'busy');
        element.style.transform = 'scale(1)';
        try {
            await fontsReady();
            const blob = await withTimeout(html2pdf().set(opt).from(element).outputPdf('blob'), 60000);
            dlDone(await saveBlob(blob, 'Question_Paper.pdf'), 'PDF');
        } catch (e) {
            dlStatus('⚠️ PDF তৈরি করা যায়নি। আবার চেষ্টা করুন।', 'err');
        } finally {
            element.style.transform = originalTransform;
        }
    }

    async function downloadImage() {
        if (typeof html2canvas === 'undefined') {
            dlStatus('⚠️ ছবি তৈরির লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।', 'err');
            return;
        }
        const element = document.getElementById('a4Paper');
        const originalTransform = element.style.transform;

        dlStatus('⏳ ছবি তৈরি হচ্ছে... একটু অপেক্ষা করুন', 'busy');
        element.style.transform = 'scale(1)';
        try {
            await fontsReady();
            const canvas = await withTimeout(html2canvas(element, { scale: 2, useCORS: true }), 60000);
            const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
            dlDone(await saveBlob(blob, 'Question_Paper.png'), 'ছবি');
        } catch (e) {
            dlStatus('⚠️ ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।', 'err');
        } finally {
            element.style.transform = originalTransform;
        }
    }

    /* ---------- খসড়া সংরক্ষণ (রিফ্রেশ বা অ্যাপ বন্ধ করলেও লেখা থাকে) ---------- */
    function scheduleSave() {
        if (restoring) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveDraft, 500);
    }

    function collectDraft() {
        const d = {
            v: 2,
            fields: {},
            font: document.getElementById('fontSelector').value,
            layout: document.getElementById('layoutSelector').value,
            fonts: customFonts.slice(),
            logoSize: document.getElementById('logoSizeSlider').value,
            logoOpacity: document.getElementById('logoOpacitySlider').value,
            questions: []
        };
        FIELD_IDS.forEach(id => { d.fields[id] = document.getElementById(id).value; });
        document.querySelectorAll('.question-card').forEach(card => {
            const id = card.id.replace('q-card-', '');
            const tc = card.querySelector('.table-container-area');
            const idRe = new RegExp('tbl-' + id + '(?!\\d)', 'g');
            d.questions.push({
                label: card.querySelector('.q-label-input').value,
                auto: card.dataset.auto,
                html: card.querySelector('.q-text-input').innerHTML,
                marks: card.querySelector('.q-marks-input').innerHTML,
                fs: card.querySelector('.q-text-input').style.fontSize,
                marksFs: card.querySelector('.q-marks-input').style.fontSize,
                table: tc.querySelector('table') ? tc.innerHTML.replace(idRe, 'tbl-__ID__') : '',
                subs: Array.from(card.querySelectorAll('.sub-row')).map(r => ({
                    label: r.querySelector('.sub-label-input').value,
                    html: r.querySelector('.sub-text-input').innerHTML,
                    fs: r.querySelector('.sub-text-input').style.fontSize
                }))
            });
        });
        return d;
    }

    function saveDraft() {
        try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collectDraft())); } catch (e) {}
    }

    function restoreDraft() {
        let d = null;
        try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { d = null; }
        if (!d || !d.questions || !d.questions.length) return false;

        restoring = true;
        try {
            FIELD_IDS.forEach(id => { if (d.fields && d.fields[id] != null) document.getElementById(id).value = d.fields[id]; });
            (d.fonts || []).forEach(n => { registerFont(n); customFonts.push(n); });

            const fontSel = document.getElementById('fontSelector');
            if (d.font && Array.from(fontSel.options).some(o => o.value === d.font)) fontSel.value = d.font;

            const layoutSel = document.getElementById('layoutSelector');
            if (d.layout) layoutSel.value = d.layout;
            document.getElementById('a4Paper').classList.toggle('full-page', layoutSel.value === 'portrait');

            if (d.logoSize) document.getElementById('logoSizeSlider').value = d.logoSize;
            if (d.logoOpacity) document.getElementById('logoOpacitySlider').value = d.logoOpacity;

            document.getElementById('questionsContainer').innerHTML = '';
            questionCount = 0;
            d.questions.forEach(q => {
                const id = addNewQuestion();
                const card = document.getElementById('q-card-' + id);
                card.querySelector('.q-label-input').value = q.label;
                if (q.auto) card.dataset.auto = q.auto;
                card.querySelector('.q-text-input').innerHTML = q.html || '';
                card.querySelector('.q-marks-input').innerHTML = q.marks || '';
                card.querySelector('.q-text-input').style.fontSize = q.fs || '';
                card.querySelector('.q-marks-input').style.fontSize = q.marksFs || '';
                if (q.table) {
                    const tc = document.getElementById('table-container-' + id);
                    tc.innerHTML = q.table.split('tbl-__ID__').join('tbl-' + id);
                    const td = tc.querySelector('td');
                    const rs = tc.querySelectorAll('input[type=range]');
                    if (td && rs.length === 2) {
                        rs[0].value = parseInt(td.style.height) || 50;
                        rs[1].value = parseInt(td.style.minWidth) || 50;
                    }
                }
                (q.subs || []).forEach(s => {
                    const row = addSubQuestion(id);
                    row.querySelector('.sub-label-input').value = s.label;
                    row.querySelector('.sub-text-input').innerHTML = s.html || '';
                    row.querySelector('.sub-text-input').style.fontSize = s.fs || '';
                });
            });

            let logo = null;
            try { logo = localStorage.getItem(LOGO_KEY); } catch (e) {}
            if (logo) setLogo(logo);
            changeFont();
        } finally {
            restoring = false;
        }
        return true;
    }

    function resetAll() {
        if (!confirm("সব লেখা (প্রশ্ন ও তথ্য) মুছে নতুন করে শুরু করবেন?")) return;
        try { localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(LOGO_KEY); } catch (e) {}
        FIELD_IDS.forEach(id => { document.getElementById(id).value = ''; });

        const wm = document.getElementById('pLogoWatermark');
        wm.removeAttribute('src');
        document.getElementById('madrasaLogo').value = '';
        const sz = document.getElementById('logoSizeSlider');
        const op = document.getElementById('logoOpacitySlider');
        sz.value = 200; op.value = 10; sz.disabled = true; op.disabled = true;

        document.getElementById('questionsContainer').innerHTML = '';
        questionCount = 0;
        addNewQuestion();

        document.getElementById('previewWrapper').style.display = 'none';
        document.getElementById('paperContentArea').innerHTML = '';
        syncWatermarks();
        scheduleSave();
    }

    ['input', 'change', 'click'].forEach(ev => document.addEventListener(ev, scheduleSave, true));
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); });

    window.onload = function() {
        if (!restoreDraft()) addNewQuestion();
    };
<\/script>

</body>
</html>
</script>
</body>
